# Render Blueprint — https://render.com/docs/blueprint-spec
# Cria: 1 PostgreSQL gerenciado + backend Django (web/Python) + frontend (static site).
# Nada precisa ser criado no dashboard; só as env vars marcadas com "sync: false".

databases:
  - name: toca-do-espanhol-db
    databaseName: toca_espanhol
    user: toca_do_espanhol
    plan: free

services:
  # ─────────────────────────────── BACKEND ───────────────────────────────
  - type: web
    name: toca-do-espanhol-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Conecta a env var DATABASE_URL ao banco criado acima, automaticamente.
      - key: DATABASE_URL
        fromDatabase:
          name: toca-do-espanhol-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: JWT_ACCESS_LIFETIME_MIN
        value: "15"
      - key: JWT_REFRESH_LIFETIME_DAYS
        value: "7"
      # Definidas manualmente no dashboard (sync: false):
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS          # ex.: toca-do-espanhol-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # ex.: https://toca-do-espanhol-web.onrender.com
        sync: false

  # ─────────────────────────────── FRONTEND ──────────────────────────────
  - type: web
    name: toca-do-espanhol-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    # SPA: qualquer rota cai no index.html (React Router)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Build-time (Vite inlina). ex.: https://toca-do-espanhol-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
